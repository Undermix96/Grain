server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggressively cache hashed build assets (Vite fingerprints filenames,
    # so a new deploy naturally gets new URLs and never serves stale JS/CSS).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend container. The frontend never talks
    # to the backend directly by hostname/port from the browser; Nginx is
    # the single public entry point.
    #
    # The hostname is resolved via Docker's embedded DNS (127.0.0.11) at
    # request time, through the $backend_upstream variable, rather than
    # once at Nginx startup. Without this, Nginx resolves "backend" a
    # single time when it boots; if that resolution races the backend
    # container's DNS registration, Nginx fails to start at all.
    #
    # IMPORTANT: once proxy_pass uses a variable, Nginx stops doing its
    # usual "strip the matched location prefix and append the rest"
    # rewrite — this is documented Nginx behavior (see nginx.org ticket
    # #803/#1067), not a bug. Any literal path written after the variable
    # (e.g. "/api/") would be sent as-is on *every* request, regardless of
    # the actual request path, silently breaking every route except a
    # literal "/api/". We must instead forward $request_uri explicitly,
    # which carries the original path *and* query string unchanged.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback: any non-file, non-API route serves
    # index.html so client-side routing (if added later) keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
