server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggressively cache hashed build assets (Vite fingerprints filenames,
    # so a new deploy naturally gets new URLs and never serves stale JS/CSS).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend container. The frontend never talks
    # to the backend directly by hostname/port from the browser; Nginx is
    # the single public entry point.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback: any non-file, non-API route serves
    # index.html so client-side routing (if added later) keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
